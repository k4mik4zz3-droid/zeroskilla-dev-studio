name: Publish ZeroSkilla Dev Studio

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh_on_release:
    # Wydania wyzwalane są z taga, a środowisko github-pages jest chronione
    # regułą gałęzi main. Zlecamy więc nowe wdrożenie na main.
    if: github.event_name == 'release' && vars.PUBLICATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Schedule a Pages deployment from main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });

  build:
    if: github.event_name != 'release' && vars.PUBLICATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release selection
        run: node --test scripts/build-releases.test.mjs
      - name: Test local release publisher safety
        run: python3 scripts/test-local-publisher.py
      - name: Build verified release catalog
        run: node scripts/build-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: k4mik4zz3-droid/zeroskilla-dev-studio
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'release' && vars.PUBLICATION_ENABLED != 'false'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
